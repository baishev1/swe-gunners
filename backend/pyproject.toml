[project]
name = "biletflow-api"
version = "0.1.0"
description = "BiletFlow backend API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi[standard]>=0.115",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.7",
    "reportlab>=5.0",
    "pyjwt>=2.15.1",
    "qrcode>=8.0",
    "sqlalchemy>=2.0.36",
    "uuid-utils>=0.10",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-env>=1.7.1",
    "ruff>=0.9",
    "types-qrcode>=8.2.0.20260518",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",
    "F403",
    "F405",
]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["declared_attr.directive", "sqlalchemy.orm.declared_attr.directive"]

[tool.ruff.lint.isort]
known-first-party = ["app", "core", "features"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
env = [
    "IS_DEV_ENV=true",
    "POSTGRES_SERVER=",
    "SQLITE_FILE_NAME=:memory:",
    "JWT_SECRET=test-secret",
]

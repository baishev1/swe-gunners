name: biletflow

services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      IS_DEV_ENV: "false"
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # The host nginx owns :80 and proxies here, see deploy/README.md.
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
